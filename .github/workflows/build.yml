name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: anydrop-windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: anydrop-windows-arm64, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: anydrop-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: anydrop-macos-x64, cross: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: anydrop-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (native targets only)
        if: ${{ !matrix.cross }}
        run: cargo test --all --target ${{ matrix.target }}
      - name: Build (CLI + GUI)
        run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          mkdir dist
          cp target/${{ matrix.target }}/release/anydrop$ext dist/
          cp target/${{ matrix.target }}/release/anydrop-gui$ext dist/
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/

  macos-app:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal AnyDrop.app
        run: ./scripts/macos-app.sh universal
      - name: Universal CLI
        run: |
          cargo build --release -p anydrop-cli --target x86_64-apple-darwin
          cargo build --release -p anydrop-cli --target aarch64-apple-darwin
          lipo -create -output target/anydrop \
            target/x86_64-apple-darwin/release/anydrop target/aarch64-apple-darwin/release/anydrop
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent target/AnyDrop.app dist/AnyDrop-macos-universal.app.zip
          cp target/anydrop dist/anydrop
      - uses: actions/upload-artifact@v5
        with:
          name: anydrop-macos-universal
          path: dist/
