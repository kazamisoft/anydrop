[package]
name = "anydrop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AnyDrop command line client"

[[bin]]
name = "anydrop"
path = "src/main.rs"

[dependencies]
anydrop-core = { version = "0.1.0", path = "../anydrop-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
indicatif = "0.18.6"
tokio = { version = "1.54.1", features = ["full"] }
