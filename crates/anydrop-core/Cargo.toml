[package]
name = "anydrop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AnyDrop core: LAN/Tailscale file transfer protocol, discovery and transfer engine"

[dependencies]
anyhow = "1.0.104"
fs4 = { version = "1.1.0", default-features = false }
hex = "0.4.3"
hostname = "0.4.2"
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
